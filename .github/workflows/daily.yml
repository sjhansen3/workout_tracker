name: daily brief
on:
  schedule:
    # 09:00 Chicago year-round. 14:00 UTC is 9am in CDT, 15:00 UTC is 9am in CST; the gate keeps the right one.
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
# Both workflows commit to the repo; queue them so pushes never race.
concurrency: { group: coach-commits, cancel-in-progress: false }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - id: g
        run: |
          want="0 14 * * *"; [ "$(TZ=America/Chicago date +%z)" = "-0600" ] && want="0 15 * * *"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then echo go=yes >> $GITHUB_OUTPUT; else echo go=no >> $GITHUB_OUTPUT; fi
  brief:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    env: { TZ: America/Chicago }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/weather.py --apply
      - run: python scripts/build_site.py
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - run: python scripts/daily_brief.py
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: commit
        run: |
          git config user.name "coach-bot"; git config user.email "coach@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || { git commit -m "daily: weather + site" && git pull --rebase && git push; }
