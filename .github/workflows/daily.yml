name: daily brief
on:
  schedule:
    # 06:00 Chicago year-round. 11:00 UTC is 6am in CDT, 12:00 UTC is 6am in CST; the gate keeps the right one.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - id: g
        run: |
          want="0 11 * * *"; [ "$(TZ=America/Chicago date +%z)" = "-0600" ] && want="0 12 * * *"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then echo go=yes >> $GITHUB_OUTPUT; else echo go=no >> $GITHUB_OUTPUT; fi
  brief:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    env: { TZ: America/Chicago }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/weather.py --apply
      - run: python scripts/build_site.py
        env: { REPO_URL: "${{ github.server_url }}/${{ github.repository }}" }
      - run: python scripts/daily_brief.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: commit
        run: |
          git config user.name "coach-bot"; git config user.email "coach@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || { git commit -m "daily: weather + site" && git push; }
