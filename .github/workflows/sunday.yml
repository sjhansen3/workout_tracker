name: sunday review
# Strava sync + site at 6pm. The Coach routine (a Claude Code trigger, Sun 18:45 Chicago) then reviews and writes next week.
on:
  schedule:
    # 18:00 Chicago Sundays year-round. 23:00 UTC Sun is 6pm in CDT, 00:00 UTC Mon is 6pm in CST; the gate keeps the right one.
    - cron: "0 23 * * 0"
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
# Both workflows commit to the repo; queue them so pushes never race.
concurrency: { group: coach-commits, cancel-in-progress: false }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - id: g
        run: |
          want="0 23 * * 0"; [ "$(TZ=America/Chicago date +%z)" = "-0600" ] && want="0 0 * * 1"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then echo go=yes >> $GITHUB_OUTPUT; else echo go=no >> $GITHUB_OUTPUT; fi
  review:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    env: { TZ: America/Chicago }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/strava_sync.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      - run: python scripts/build_site.py
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - name: commit
        run: |
          git config user.name "coach-bot"; git config user.email "coach@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || { git commit -m "sunday: strava sync + site" && git pull --rebase && git push; }
