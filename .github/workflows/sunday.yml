name: sunday review
on:
  schedule:
    - cron: "0 23 * * 0"   # 18:00 Chicago Sundays (CDT)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/strava_sync.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      - run: python scripts/weather.py > forecast.txt
      - run: python scripts/build_site.py
      - name: open review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const week = fs.readFileSync('data/week.json','utf8');
            const fc = fs.readFileSync('forecast.txt','utf8');
            const body = `Week just finished (status from Strava):\n\n\`\`\`json\n${week}\n\`\`\`\n\nForecast:\n\`\`\`\n${fc}\n\`\`\`\n\nOpen Claude Code in this repo and run the Sunday review (see COACH.md). Close this issue when next week is committed.`;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `Sunday review · ${new Date().toISOString().slice(0,10)}`, body});
      - name: commit
        run: |
          git config user.name "coach-bot"; git config user.email "coach@users.noreply.github.com"
          git add data docs && git diff --cached --quiet || git commit -m "sunday: strava sync + site" && git push
